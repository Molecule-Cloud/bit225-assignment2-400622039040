<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BlueLib Catalogue | BlueCrest College Library</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        // Site Header
        <header class="site-header">
            <h1 class="site-header__title">BlueLib Catalogue</h1>
            <p class="site-header__tagline">Bluecrest College Library</p>
        </header>

        // Navigation
        <nav class="site-nav">
            <ui class="site-nav__list">
                <li><a href="#catalogue">Home</a></li>
                <li><a href="#add-book">Add a book</a></li>
            </ui>
        </nav>

        // Main Content
        <main>
            <section id="catalogue" class="panel">
                <h2 class="panel__heading">Available Books</h2>
                <div class="controls">
                    <div class="field">
                        <label for="search-input"
                            >Search by title or author</label
                        >
                        <input
                            type="text"
                            id="search-input"
                            name="search"
                            placeholder="eg. Mr. Mark Mensah"
                        />
                    </div>
                    <div class="field">
                        <label for="filter-category">Filter by category</label>
                        <select id="filter-category">
                            <option value="">All</option>
                            <option value="IT">IT</option>
                            <option value="Business">Business</option>
                            <option value="Science">Science</option>
                            <option value="Arts">Arts</option>
                        </select>
                    </div>
                </div>
                <p id="results-count" class="results-counts"></p>
                <div id="book-list" class="book-grid"></div>
            </section>

            // Add a book form
            <section id="add-book" class="panel">
                <h2 class="panel__heading">Add a book</h2>
                <form id="add-book-form" class="form-grid" novalidate>
                    <div class="field">
                        <label for="book-title">Title</label>
                        <input
                            type="text"
                            id="book-title"
                            name="title"
                            required
                        />
                    </div>

                    <div class="field">
                        <label for="book-author">Author</label>
                        <input
                            type="text"
                            id="book-author"
                            name="author"
                            required
                        />
                    </div>

                    <div class="field">
                        <label for="book-category">Category</label>
                        <select id="book-category" name="category" required>
                            <option value="">Select a category</option>
                            <option value="IT">IT</option>
                            <option value="Business">Business</option>
                            <option value="Science">Science</option>
                            <option value="Arts">Arts</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="book-published">Copies Available</label>
                        <input
                            type="number"
                            id="book-copies"
                            name="copies"
                            min="0"
                            step="1"
                            required
                        />
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn--primary">Add Book</button>
                    </div>
                    <p id="form-message" class="form-message" role="alert"></pid>
                </form>
            </section>

            // Footer
            <footer class="site-footer">
                <p>Built by Benjamin Appiah. Student ID: 400622039040 </p>
            </footer>

            <script src="js/app.js"></script>
        </main>
    </body>
</html>
